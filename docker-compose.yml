services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: myproject_db
      POSTGRES_USER: myproject_user
      POSTGRES_PASSWORD: myproject_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      DB_NAME: myproject_db
      DB_USER: myproject_user
      DB_PASSWORD: myproject_pass
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - django

volumes:
  postgres_data:
